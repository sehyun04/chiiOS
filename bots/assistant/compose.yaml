# chiiOS 비서 봇. 홈 화면 [비서] 탭이 이 봇과 이야기한다.
# CHII_WORK·CHII_GITHUB 는 setup.sh 가 PC 마다 정해 옆의 .env 에 적는다(/etc/chiios/chiios.conf 가 원본).
name: assistant
services:
  assistant:
    build: .
    image: chiios-assistant:latest
    # 홈 화면 서버(127.0.0.1:7682)를 부르고, 홈 화면이 127.0.0.1:7683 으로 이 봇을 부른다.
    # 둘 다 Debian 밖으로 열지 않는 주소라 브리지 네트워크로는 서로 닿지 않는다.
    network_mode: host
    # 대화·토큰 파일이 Debian 사용자(sehyun, 1000) 것이어야 setup.sh 와 홈 화면이 손댈 수 있다.
    user: "1000:1000"
    environment:
      CHII_HOME_URL: http://127.0.0.1:7682
      ASSIST_PORT: "7683"
      ASSIST_DATA: /data
      ASSIST_WORK_ROOTS: /work
      ASSIST_GITHUB_USER: ${CHII_GITHUB:-}
      ASSIST_BRIEF_AT: "08:00"
    volumes:
      - /var/lib/chiios/assistant:/data
      # 대장의 작업 폴더. 읽기 전용이다: 비서는 git 기록을 읽기만 하고 고치지 않는다.
      # 이 PC 에 작업 폴더가 없으면 빈 폴더가 붙어 GitHub 쪽만 본다.
      - ${CHII_WORK:-/var/lib/chiios/no-work}:/work:ro
      # 이미지 기본 시계는 UTC 다. 그대로면 비서가 "지금 07:47" 처럼 한국 시각과 9시간 어긋난 상태를 본다.
      - /etc/localtime:/etc/localtime:ro
    # chiiOS 기본값(setup.sh 의 daemon.json)과 같지만, 레포를 따로 떼어 다른 데서 돌려도 기록이 끝없이 쌓이지 않게 직접 적는다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
