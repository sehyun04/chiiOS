<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chiiOS</title>
<meta name="theme-color" content="#f4eada">
<link rel="icon" href="faces/hachiware-work.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
  // 칠하기 전에 낮·밤을 정해야 밝은 판이 한 번 번쩍이지 않는다. 같은 규칙이 app.js 의 theme() 에 있다.
  (function () {
    var pref = "auto";
    try { pref = localStorage.getItem("chii-theme") || "auto"; } catch (e) {}
    var h = new Date().getHours();
    var night = pref === "night" || (pref === "auto" && (h >= 19 || h < 7));
    document.documentElement.dataset.theme = night ? "night" : "day";
  })();
</script>
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="desk">
  <section class="pane main on" data-n="1">
    <header>
      <span class="n">1</span>
      <div class="tabs" role="tablist" aria-label="1번 칸">
        <button class="tab" role="tab" id="tab-chat" data-tab="chat" aria-controls="view-chat" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>비서</button>
        <button class="tab" role="tab" id="tab-term" data-tab="term" aria-controls="view-term" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>터미널</button>
      </div>
      <span class="sp"></span>
      <span class="mono dim side-term" id="who"></span>
      <button class="ghost side-chat" id="chat-brief" type="button" title="지난 보고 뒤로 무슨 일이 있었는지 지금 모아 본다">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path></svg>지금 보고</button>
      <button class="ghost side-chat" id="chat-new" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>새 대화</button>
    </header>
    <div class="view chat-view" id="view-chat" role="tabpanel" aria-labelledby="tab-chat">
      <ol class="chat-log" id="chat-log" aria-live="polite"></ol>
      <form class="composer" id="chat-form">
        <textarea id="chat-input" rows="1" placeholder="비서에게 말 걸기" aria-label="비서에게 말 걸기" autocomplete="off"></textarea>
        <button class="glass primary send" id="chat-send" type="submit" aria-label="보내기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></button>
      </form>
    </div>
    <div class="view term-box" id="view-term" role="tabpanel" aria-labelledby="tab-term" hidden>
      <div id="term" aria-label="터미널"></div>
      <div class="term-cover" id="term-cover" hidden>
        <img src="faces/hachiware-work.png" alt="">
        <b>셸이 닫혔어</b>
        <span class="dim">Enter 를 누르거나 아래 단추로 새로 연다</span>
        <button class="glass primary" id="term-reopen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>다시 열기</button>
      </div>
    </div>
  </section>

  <div class="side">
    <section class="pane" data-n="2">
      <header>
        <span class="n">2</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>
        <b>봇</b>
        <span class="sp"></span>
        <span class="dim" id="bot-count"></span>
      </header>
      <div class="body" id="bots"></div>
    </section>

    <section class="pane todo" data-n="3">
      <header>
        <span class="n">3</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><polyline points="8 12 11 15 16 9"></polyline></svg>
        <b>오늘 할 일</b>
        <span class="sp"></span>
        <span class="dim" id="today"></span>
      </header>
      <div class="body">
        <div class="progress"><div class="track"><div class="fill" id="todo-fill"></div></div><span class="mono dim" id="todo-count"></span></div>
        <ul id="todos"></ul>
        <form id="todo-form">
          <label class="add">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
            <input id="todo-input" placeholder="할 일 더하기" autocomplete="off" aria-label="할 일 더하기">
          </label>
        </form>
        <img class="mascot" src="faces/chiikawa-work.png" alt="">
      </div>
    </section>

    <section class="pane log" data-n="4">
      <header>
        <span class="n">4</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline></svg>
        <b>오늘 기록</b>
      </header>
      <ol class="body" id="events"></ol>
    </section>
  </div>

  <footer class="bar">
    <span class="seg brand">chiiOS</span>
    <span class="seg sky"><i class="dot"></i><span id="up"></span></span>
    <span class="seg sun">메모리<span class="meter"><span id="mem-fill"></span></span><span id="mem"></span></span>
    <span class="seg blush" id="disk"></span>
    <span class="sp"></span>
    <span class="hint mono">Alt+1~4 칸 옮기기</span>
    <button class="seg glass bubble" id="bubble" type="button" title="비서와 이야기하기"><img src="faces/hachiware-work.png" alt=""><span id="say"></span></button>
    <button class="seg glass primary upd" id="upd" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg><span id="upd-label"></span></button>
    <button class="seg glass mode" id="mode" type="button"><span id="mode-icon"></span><span id="mode-label"></span></button>
    <span class="seg card mono" id="clock"></span>
  </footer>
</div>

<dialog id="dlg">
  <div class="dlg-head"><b id="dlg-title"></b><button class="x" id="dlg-close" aria-label="닫기">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
  <div id="dlg-body"></div>
  <div class="btns" id="dlg-btns"></div>
</dialog>

<script src="vendor/xterm/xterm.js"></script>
<script src="vendor/xterm/addon-fit.js"></script>
<script src="vendor/xterm/addon-web-links.js"></script>
<script src="term.js"></script>
<script src="chat.js"></script>
<script src="app.js"></script>
</body>
</html>
