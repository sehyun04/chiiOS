<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chiiOS</title>
<link rel="icon" href="faces/hachiware-work.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="desk">
  <section class="pane term on" data-n="1">
    <header>
      <span class="n">1</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
      <b>터미널</b>
      <span class="sp"></span>
      <span class="mono dim" id="who"></span>
    </header>
    <iframe id="ttyd" title="터미널"></iframe>
  </section>

  <div class="side">
    <section class="pane" data-n="2">
      <header>
        <span class="n">2</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>
        <b>봇</b>
        <span class="sp"></span>
        <span class="dim" id="bot-count"></span>
      </header>
      <div class="body" id="bots"></div>
    </section>

    <section class="pane todo" data-n="3">
      <header>
        <span class="n">3</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><polyline points="8 12 11 15 16 9"></polyline></svg>
        <b>오늘 할 일</b>
        <span class="sp"></span>
        <span class="dim" id="today"></span>
      </header>
      <div class="body">
        <div class="progress"><div class="track"><div class="fill" id="todo-fill"></div></div><span class="mono dim" id="todo-count"></span></div>
        <ul id="todos"></ul>
        <form id="todo-form">
          <label class="add">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
            <input id="todo-input" placeholder="할 일 더하기" autocomplete="off" aria-label="할 일 더하기">
          </label>
        </form>
        <img class="mascot" src="faces/chiikawa-work.png" alt="">
      </div>
    </section>

    <section class="pane log" data-n="4">
      <header>
        <span class="n">4</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline></svg>
        <b>오늘 기록</b>
      </header>
      <ol class="body" id="events"></ol>
    </section>
  </div>

  <footer class="bar">
    <span class="seg brand">chiiOS</span>
    <span class="seg sky"><i class="dot"></i><span id="up"></span></span>
    <span class="seg sun">메모리<span class="meter"><span id="mem-fill"></span></span><span id="mem"></span></span>
    <span class="seg blush" id="disk"></span>
    <span class="sp"></span>
    <span class="hint mono">Alt+1~4 칸 옮기기</span>
    <span class="seg glass bubble"><img src="faces/hachiware-work.png" alt=""><span id="say"></span></span>
    <span class="seg card mono" id="clock"></span>
  </footer>
</div>

<dialog id="dlg">
  <div class="dlg-head"><b id="dlg-title"></b><button class="x" id="dlg-close" aria-label="닫기">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
  <div id="dlg-body"></div>
  <div class="btns" id="dlg-btns"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
